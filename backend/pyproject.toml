[project]
name = "ews-backend"
version = "0.1.0"
description = "Explore Wisata Sumut FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.1.3",
    "cryptography>=42.0.8",
    "email-validator>=2.2.0",
    "fastapi==0.110.1",
    "google-auth>=2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "motor>=3.4.0",
    "Pillow>=10.3.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1,<3.0.0",
    "PyJWT>=2.10.1",
    "pymongo>=4.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "tzdata>=2024.2",
]


[tool.vercel]
entrypoint = "app.main:app"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
