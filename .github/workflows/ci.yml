name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build production bundle
        run: npm run build
        env:
          CI: true
          REACT_APP_SITE_URL: https://explorewisatasumut.com
          REACT_APP_BACKEND_URL: https://explorewisatasumut.com

  backend:
    name: Backend unit contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ews_ci
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      COOKIE_SECURE: "false"
      USE_LLM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run isolated unit contracts
        run: >-
          python -m pytest -q
          tests/test_planner_contract.py
          tests/test_planner_guard.py
          tests/test_google_auth_direct.py
          tests/test_llm_security_unit.py
          tests/test_planner_analytics_contract.py
          tests/test_planner_api_contract.py
          tests/test_web_experience_security_unit.py
